<section id="lv30Page" class="lv30-page app-view" aria-label="Thank you for playing">
  <div class="lv30-backdrop" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <main class="lv30-content">
    <div class="lv30-message" aria-label="Thank you for playing">
      <div class="lv30-row" data-row="0" aria-label="Thank">
        <button class="lv30-letter" type="button" data-index="0" aria-label="T"><span>T</span></button>
        <button class="lv30-letter" type="button" data-index="1" aria-label="h"><span>h</span></button>
        <button class="lv30-letter" type="button" data-index="2" aria-label="a"><span>a</span></button>
        <button class="lv30-letter" type="button" data-index="3" aria-label="n"><span>n</span></button>
        <button class="lv30-letter" type="button" data-index="4" aria-label="k"><span>k</span></button>
      </div>

      <div class="lv30-row" data-row="1" aria-label="you">
        <button class="lv30-letter" type="button" data-index="5" aria-label="y"><span>y</span></button>
        <button class="lv30-letter" type="button" data-index="6" aria-label="o"><span>o</span></button>
        <button class="lv30-letter" type="button" data-index="7" aria-label="u"><span>u</span></button>
      </div>

      <div class="lv30-row" data-row="2" aria-label="for">
        <button class="lv30-letter" type="button" data-index="8" aria-label="f"><span>f</span></button>
        <button class="lv30-letter" type="button" data-index="9" aria-label="o"><span>o</span></button>
        <button class="lv30-letter" type="button" data-index="10" aria-label="r"><span>r</span></button>
      </div>

      <div class="lv30-row" data-row="3" aria-label="playing">
        <button class="lv30-letter" type="button" data-index="11" aria-label="p"><span>p</span></button>
        <button class="lv30-letter" type="button" data-index="12" aria-label="l"><span>l</span></button>
        <button class="lv30-letter" type="button" data-index="13" aria-label="a"><span>a</span></button>
        <button class="lv30-letter" type="button" data-index="14" aria-label="y"><span>y</span></button>
        <button class="lv30-letter" type="button" data-index="15" aria-label="i"><span>i</span></button>
        <button class="lv30-letter" type="button" data-index="16" aria-label="n"><span>n</span></button>
        <button class="lv30-letter" type="button" data-index="17" aria-label="g"><span>g</span></button>
      </div>
    </div>
  </main>

  <footer class="lv30-footer">
    <p><span>To Be Continued</span><i aria-hidden="true"></i></p>
    <button id="lv30HomeButton" class="lv30-home" type="button">HOME</button>
  </footer>

  <p id="lv30SoundHint" class="lv30-sound-hint" aria-live="polite">동그라미를 터치해 작은 선율을 들어보세요</p>
</section>
